<header class="fixed top-0 left-0 right-0 md:border-b-2 transition-colors duration-300 z-50"
     [ngClass]="isDarkMode() ? 'bg-slate-900 md:border-b-slate-800 text-white' : 'bg-white md:border-b-slate-200 text-slate-800'">

    <div class="flex justify-between items-center px-4 sm:px-6 md:px-10 py-3 md:py-5">

        <!-- Logo AR (adaptatif selon le mode) -->
         @if (!isMobile()) {
          <a (click)="scrollToSection('home')" class="cursor-pointer flex items-center lg:ml-30">
              <img [src]="isDarkMode() ? 'assets/images/logo-dark.png' : 'assets/images/logo-white.png'"
                  alt="Logo AR"
                  class="h-10 w-auto md:h-15 md:w-25 transition-transform duration-200 hover:scale-105" />
          </a>
        }

        <div class="flex items-center gap-2 md:gap-8">

            <!-- Navigation desktop (cachée sur mobile) -->
            @if (!isMobile()) {
            <nav class="flex gap-5">
                @for (item of items; track item.id) {
                    <button
                      (click)="scrollToSection(item.id)"
                      [ngClass]="activeSection() === item.id
                        ? item.colorClass + ' font-bold scale-105'
                        : (isDarkMode() ? 'text-gray-300 hover:text-white' : 'text-gray-700 hover:text-black')"
                      class="transition-all duration-200 cursor-pointer hover:opacity-80">
                      {{ item.label }}
                    </button>
                }
            </nav>
            }
            <div class="flex items-center gap-2 md:gap-4">
            <!-- Bouton burger (visible uniquement sur mobile) -->
            @if (isMobile()) {
            <button
              (click)="toggleMenu()"
              class="p-2 rounded-md transition-colors duration-200 cursor-pointer"
              [ngClass]="isDarkMode() ? 'hover:bg-slate-800' : 'hover:bg-slate-200'"
              aria-label="Ouvrir le menu"
              [attr.aria-expanded]="isMenuOpen()">
              @if (isMenuOpen()) {
                <!-- Icône croix -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
              } @else {
                <!-- Icône burger -->
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              }
            </button>
            }

            <!-- Bouton Dark Mode -->
            <button
              (click)="toggleDarkMode()"
              aria-label="Changer le thème"
              [ngClass]="isDarkMode() ? 'hover:bg-slate-800' : 'hover:bg-slate-200'"
              class="p-2 rounded-full transition-colors duration-200 cursor-pointer">
              @if (isDarkMode()) {
                <!-- Icône Soleil -->
                <svg class="w-6 h-6 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
              } @else {
                <!-- Icône Lune -->
                <svg class="w-6 h-6 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
              }
            </button>
            </div>
        
        </div>
    </div>

    <!-- Menu mobile déroulant -->
    @if (isMobile() && isMenuOpen()) {
        <nav class="flex flex-col px-4 sm:px-6 pb-4 border-t"
             [ngClass]="isDarkMode() ? 'border-slate-800' : 'border-slate-200'">
            @for (item of items; track item.id) {
                <button
                  (click)="scrollToSection(item.id)"
                  [ngClass]="activeSection() === item.id
                    ? item.colorClass + ' font-bold'
                    : (isDarkMode() ? 'text-gray-300 hover:text-white' : 'text-gray-700 hover:text-black')"
                  class="text-left py-3 transition-colors duration-200 cursor-pointer">
                  {{ item.label }}
                </button>
            }
        </nav>
    }
</header>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 p-6 font-sans md:w-300 transition-colors duration-300"
     [ngClass]="isDarkMode() ? 'bg-slate-900' : 'bg-gray-50'">

  <div *ngFor="let category of categories"
       class="rounded-xl p-6 min-h-50 hover:border-emerald-500 hover:shadow-md hover:scale-105 transition-all duration-300 cursor-pointer border"
       [ngClass]="isDarkMode() ? 'bg-slate-800 border-slate-700 text-white' : 'bg-white border-gray-100 text-gray-900'">
    
    <!-- Header -->
    <div class="flex items-center justify-center gap-2.5 mb-4">
      <h3 class="text-[17px] text-center font-bold m-0 transition-colors duration-300"
          [ngClass]="isDarkMode() ? 'text-white' : 'text-gray-900'">
        {{ category.title }}
      </h3>
    </div>

    <!-- Skill list -->
    <ul class="list-none m-0 p-0">
      <li *ngFor="let skill of category.skills; last as isLast"
          class="flex items-center justify-between py-2.5 text-[15px] transition-colors duration-300"
          [ngClass]="[
            isDarkMode() ? 'text-gray-200' : 'text-gray-700',
            !isLast ? (isDarkMode() ? 'border-b border-slate-700' : 'border-b border-gray-100') : ''
          ]">
        
        <div class="flex items-center gap-2.5">
          <fa-icon *ngIf="skill.icon; else imgIcon" 
                   [icon]="skill.icon" 
                   class="w-7 text-center text-[20px]" 
                   [ngClass]="skill.couleur"></fa-icon>
                   
          <ng-template #imgIcon>
            <img [src]="skill.iconUrl" alt="icon" class="w-7 h-7 object-contain" />
          </ng-template>
          
          <p class="m-0">{{ skill.name }}</p>
        </div>

        <!-- Level Badge -->
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full whitespace-nowrap transition-colors duration-300"
              [ngClass]="levelClass(skill.level)">
          {{ skill.level }}
        </span>
      </li>
    </ul>

    <!-- Tags -->
    <div class="flex flex-wrap gap-2 mt-4" *ngIf="category.tags?.length">
      <span *ngFor="let tag of category.tags"
            class="text-xs font-semibold px-2.5 py-1 rounded-md transition-colors duration-300"
            [ngClass]="isDarkMode() ? 'text-violet-300 bg-violet-950/60 border border-violet-800' : 'text-violet-600 bg-violet-50'">
        {{ tag }}
      </span>
    </div>

  </div>
</div>
